name: Apply atomic counter modernization

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-modernize-consume-sink-atomic-counter.yml'
      - 'consume_sink_test.go'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-modernize-consume-sink-atomic-counter
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'ORESoftware/amqp091-go' &&
      (github.event_name != 'pull_request' || github.head_ref == 'fix/modernize-consume-sink-atomic-counter')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact writable branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/modernize-consume-sink-atomic-counter
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Setup Go 1.26.5
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'
          cache: false

      - name: Modernize the test counter without changing synchronization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('consume_sink_test.go')
          source = path.read_text()
          replacements = [
              ('\tvar count int64\n', '\tvar count atomic.Int64\n', 1),
              ('\t\tatomic.AddInt64(&count, 1)\n', '\t\tcount.Add(1)\n', 1),
              ('\tif got := atomic.LoadInt64(&count); got != 1 {\n', '\tif got := count.Load(); got != 1 {\n', 1),
          ]
          for before, after, expected in replacements:
              actual = source.count(before)
              if actual != expected:
                  raise SystemExit(
                      f'expected {expected} occurrence(s) of {before!r}, found {actual}'
                  )
              source = source.replace(before, after, expected)
          path.write_text(source)
          PY
          gofmt -w consume_sink_test.go

      - name: Validate the full library and lint surface
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go test -race ./...
          go vet ./...
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run
          git diff --check
          test "$(git status --short | awk '{print $2}' | sort)" = 'consume_sink_test.go'
          ! grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' consume_sink_test.go

      - name: Remove one-shot workflow and commit the focused fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-modernize-consume-sink-atomic-counter.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/apply-modernize-consume-sink-atomic-counter.yml\nconsume_sink_test.go'
          git commit -m 'test: modernize ConsumeSink atomic counter'
          git push origin HEAD:fix/modernize-consume-sink-atomic-counter
